<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blank Website Layout with Games</title>
    
    <style>
        /* Basic Reset & Smooth Scrolling */
        html {
            scroll-behavior: smooth;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Navbar / Header */
        header {
            background: #ffffff;
            padding: 1rem 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header h1 {
            font-size: 2rem;
            color: #222;
        }

        /* Top Right Games Button */
        .btn-games {
            background-color: #007bff;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 5px;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }

        .btn-games:hover {
            background-color: #0056b3;
        }

        /* Main Content Area */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4rem 20px;
        }

        /* Explanation Area Styling */
        .explanation-wrapper {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            border: 2px dashed #ccc; 
            border-radius: 8px;
            min-height: 300px;
            background-color: #fff;
            
            /* LARGE MARGIN to push games further down */
            margin-bottom: 900px; 
        }

        /* Games Section Styling */
        #games {
            width: 100%;
            max-width: 1000px;
            /* Extra padding-top prevents the sticky header from overlapping the title */
            padding-top: 120px; 
            text-align: center;
        }

        #games h2 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            color: #222;
        }

        .games-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-bottom: 6rem;
        }

        .game-card {
            width: 280px;
            height: 200px;
            background-color: #e2e2ea;
            border: 1px solid #d1d1e0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: #666;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .game-card:hover {
            transform: translateY(-8px);
            background-color: #d8d8e5;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            background-color: #222;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <h1>Your Website Title</h1>
        <a href="#games" class="btn-games">Games</a>
    </header>

    <main>
        
        <div class="explanation-wrapper" id="page-explanation">
            </div>
        <section id="games">
            <h2>Our Games</h2>
            
            <div class="games-grid">
                <div class="game-card">Game Space 1</div>
                <div class="game-card)Space 2</div>
                <div class="game-card">Game Space 3</div>
                <div class="game-card">Game Space 4</div>
            </div>
        </section>
        </main>

    <footer>
        <p>&copy; 2026 Your Name. All rights reserved.</p>
    </footer>

    <script>
        // JS functionality
        window.onload = () => {
            console.log("Layout ready. The Games section is now significantly lower on the page.");
        };
    </script>

</body>
</html>
