<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NOVA — Digital Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a08;
      --surface: #111110;
      --border: #2a2a26;
      --accent: #e8ff3c;
      --accent2: #ff5533;
      --text: #f0ede6;
      --muted: #6b6b5e;
      --font-display: 'Bebas Neue', sans-serif;
      --font-serif: 'DM Serif Display', serif;
      --font-mono: 'Space Mono', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.6;
      cursor: none;
      overflow-x: hidden;
    }

    /* Custom cursor */
    #cursor {
      position: fixed;
      width: 12px; height: 12px;
      background: var(--accent);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s, background 0.2s;
      mix-blend-mode: difference;
    }
    #cursor-ring {
      position: fixed;
      width: 36px; height: 36px;
      border: 1px solid var(--accent);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: transform 0.12s ease-out, width 0.2s, height 0.2s;
      mix-blend-mode: difference;
    }
    body:has(a:hover) #cursor, body:has(button:hover) #cursor {
      width: 20px; height: 20px;
    }

    /* Noise overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9990;
      opacity: 0.35;
    }

    /* Nav */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 3rem;
      border-bottom: 1px solid transparent;
      transition: border-color 0.3s, background 0.3s;
    }
    nav.scrolled {
      border-color: var(--border);
      background: rgba(10,10,8,0.85);
      backdrop-filter: blur(12px);
    }
    .nav-logo {
      font-family: var(--font-display);
      font-size: 2rem;
      letter-spacing: 0.05em;
      color: var(--accent);
    }
    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }
    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--text); }
    .nav-cta {
      background: var(--accent);
      color: var(--bg) !important;
      padding: 0.5rem 1.2rem;
      font-weight: 700;
      transition: background 0.2s !important;
    }
    .nav-cta:hover { background: var(--accent2) !important; color: var(--text) !important; }

    /* Hero */
    #hero {
      min-height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: 0 3rem;
      padding-top: 8rem;
      position: relative;
      overflow: hidden;
    }
    .hero-grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.4;
      mask-image: radial-gradient(ellipse at 50% 0%, black 30%, transparent 80%);
    }
    .hero-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: end;
      gap: 4rem;
      padding-bottom: 6rem;
      position: relative;
    }
    .hero-headline {
      font-family: var(--font-display);
      font-size: clamp(5rem, 12vw, 13rem);
      line-height: 0.92;
      letter-spacing: -0.01em;
    }
    .hero-headline em {
      font-family: var(--font-serif);
      font-style: italic;
      color: var(--accent);
      display: block;
    }
    .hero-right {
      padding-bottom: 1rem;
    }
    .hero-tag {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .hero-tag::before {
      content: '';
      display: inline-block;
      width: 24px; height: 1px;
      background: var(--accent2);
    }
    .hero-desc {
      font-size: 15px;
      line-height: 1.8;
      color: #c8c5be;
      margin-bottom: 2.5rem;
      max-width: 36ch;
    }
    .btn-group { display: flex; gap: 1rem; flex-wrap: wrap; }
    .btn {
      display: inline-block;
      padding: 0.9rem 2rem;
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      border: none;
      cursor: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--accent);
      color: var(--bg);
      font-weight: 700;
    }
    .btn-primary:hover { background: var(--accent2); color: var(--text); }
    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    .hero-ticker {
      border-top: 1px solid var(--border);
      padding: 1.2rem 0;
      overflow: hidden;
      position: relative;
    }
    .ticker-track {
      display: flex;
      gap: 4rem;
      white-space: nowrap;
      animation: ticker 24s linear infinite;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    @keyframes ticker {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }
    .ticker-sep { color: var(--accent); }

    /* Stats */
    #stats {
      padding: 6rem 3rem;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--border);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .stat-item {
      background: var(--bg);
      padding: 3rem 2.5rem;
      transition: background 0.3s;
    }
    .stat-item:hover { background: var(--surface); }
    .stat-num {
      font-family: var(--font-display);
      font-size: 4.5rem;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    .stat-label {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Work */
    #work {
      padding: 8rem 3rem;
    }
    .section-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 4rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 2rem;
    }
    .section-label {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent2);
      margin-bottom: 0.75rem;
    }
    .section-title {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 5vw, 5rem);
      line-height: 1;
    }
    .section-title em {
      font-family: var(--font-serif);
      font-style: italic;
      color: var(--muted);
    }
    .section-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      padding-bottom: 2px;
      transition: color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    .section-link:hover { color: var(--accent); border-color: var(--accent); }

    .work-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      grid-template-rows: auto auto;
      gap: 1.5rem;
    }
    .work-card {
      position: relative;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: none;
      group: true;
    }
    .work-card:first-child { grid-row: 1 / 3; }
    .work-card-inner {
      aspect-ratio: unset;
      height: 100%;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 2.5rem;
      position: relative;
    }
    .work-card:first-child .work-card-inner { min-height: 540px; }
    .work-bg {
      position: absolute;
      inset: 0;
      transition: transform 0.6s ease, filter 0.4s;
      background-size: cover;
      background-position: center;
      filter: brightness(0.35) saturate(0.6);
    }
    .work-card:hover .work-bg {
      transform: scale(1.04);
      filter: brightness(0.5) saturate(0.8);
    }
    .work-bg-1 { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%); }
    .work-bg-2 { background: linear-gradient(135deg, #2d1b69 0%, #11998e 100%); }
    .work-bg-3 { background: linear-gradient(135deg, #c94b4b 0%, #4b134f 100%); }
    .work-tag {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 0.25rem 0.6rem;
      margin-bottom: 1rem;
      position: relative;
      z-index: 1;
      width: fit-content;
    }
    .work-name {
      font-family: var(--font-display);
      font-size: 2.8rem;
      line-height: 1;
      position: relative;
      z-index: 1;
      margin-bottom: 0.5rem;
    }
    .work-card:first-child .work-name { font-size: 4rem; }
    .work-meta {
      font-size: 11px;
      color: var(--muted);
      position: relative;
      z-index: 1;
      letter-spacing: 0.1em;
    }
    .work-arrow {
      position: absolute;
      top: 2rem; right: 2rem;
      width: 44px; height: 44px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 18px;
      z-index: 2;
      opacity: 0;
      transform: translate(4px, -4px);
      transition: opacity 0.3s, transform 0.3s, border-color 0.2s;
    }
    .work-card:hover .work-arrow {
      opacity: 1;
      transform: translate(0, 0);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Services */
    #services {
      padding: 8rem 3rem;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      margin-top: 4rem;
    }
    .service-item {
      background: var(--surface);
      padding: 3.5rem 3rem;
      position: relative;
      overflow: hidden;
      transition: background 0.3s;
    }
    .service-item:hover { background: #161614; }
    .service-num {
      font-family: var(--font-display);
      font-size: 6rem;
      color: var(--border);
      line-height: 1;
      margin-bottom: 2rem;
      transition: color 0.3s;
    }
    .service-item:hover .service-num { color: #2a2a26; }
    .service-name {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-style: italic;
      margin-bottom: 1rem;
      color: var(--text);
    }
    .service-desc {
      font-size: 13px;
      line-height: 1.8;
      color: var(--muted);
      margin-bottom: 2rem;
    }
    .service-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .tag {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.25rem 0.6rem;
      border: 1px solid var(--border);
      color: var(--muted);
      transition: border-color 0.2s, color 0.2s;
    }
    .service-item:hover .tag { border-color: #3a3a36; color: #8a8a7e; }

    /* Marquee */
    .marquee-section {
      padding: 3rem 0;
      overflow: hidden;
      border-top: 1px solid var(--border);
    }
    .marquee-track {
      display: flex;
      gap: 0;
      animation: marquee 30s linear infinite;
    }
    .marquee-item {
      display: flex;
      align-items: center;
      gap: 2rem;
      padding: 0 3rem;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .marquee-item span {
      font-family: var(--font-display);
      font-size: 3.5rem;
      letter-spacing: 0.05em;
      color: var(--border);
      transition: color 0.2s;
    }
    .marquee-item span:hover { color: var(--text); }
    .marquee-dot {
      width: 8px; height: 8px;
      background: var(--accent2);
      border-radius: 50%;
      flex-shrink: 0;
    }
    @keyframes marquee {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    /* CTA */
    #cta {
      padding: 10rem 3rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    #cta::before {
      content: '';
      position: absolute;
      width: 800px; height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(232,255,60,0.05) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .cta-label {
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent2);
      margin-bottom: 1.5rem;
    }
    .cta-title {
      font-family: var(--font-display);
      font-size: clamp(4rem, 10vw, 10rem);
      line-height: 0.95;
      margin-bottom: 2.5rem;
    }
    .cta-title em {
      font-family: var(--font-serif);
      font-style: italic;
      color: var(--accent);
    }
    .cta-sub {
      font-size: 15px;
      color: var(--muted);
      max-width: 44ch;
      margin: 0 auto 3rem;
      line-height: 1.8;
    }

    /* Footer */
    footer {
      padding: 3rem;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer-logo {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: var(--muted);
    }
    .footer-copy {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.1em;
    }
    .footer-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }
    .footer-links a {
      font-size: 11px;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .footer-links a:hover { color: var(--text); }

    /* Animations */
    .reveal {
      opacity: 0;
      transform: translateY(32px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .reveal.visible {
      opacity: 1;
      transform: none;
    }
    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.3s; }
    .reveal-delay-4 { transition-delay: 0.4s; }

    @media (max-width: 900px) {
      nav { padding: 1.2rem 1.5rem; }
      .nav-links { display: none; }
      #hero, #work, #services, #cta, footer { padding-left: 1.5rem; padding-right: 1.5rem; }
      #stats { padding: 3rem 1.5rem; grid-template-columns: repeat(2,1fr); }
      .hero-content { grid-template-columns: 1fr; }
      .work-grid { grid-template-columns: 1fr; }
      .work-card:first-child { grid-row: auto; }
      .services-grid { grid-template-columns: 1fr; }
      footer { flex-direction: column; gap: 1.5rem; text-align: center; }
    }
  </style>
</head>
<body>

<div id="cursor"></div>
<div id="cursor-ring"></div>

<nav id="navbar">
  <div class="nav-logo">NOVA</div>
  <ul class="nav-links">
    <li><a href="#work">Work</a></li>
    <li><a href="#services">Services</a></li>
    <li><a href="#cta">Contact</a></li>
    <li><a href="#cta" class="nav-cta">Start a project</a></li>
  </ul>
</nav>

<!-- Hero -->
<section id="hero">
  <div class="hero-grid-bg"></div>
  <div class="hero-content">
    <div class="reveal">
      <h1 class="hero-headline">
        WE<br>BUILD<br><em>Digital</em><br>FUTURES
      </h1>
    </div>
    <div class="hero-right">
      <p class="hero-tag reveal reveal-delay-1">Est. 2019 — Vienna, AT</p>
      <p class="hero-desc reveal reveal-delay-2">

        NOVA is a digital studio crafti
